<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Image Effects Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS3 Image Effects Assignment</h1>

    <!-- Penguins -->
    <section class="project">
        <h2>Penguins</h2>
        <img src="penguins.jpg" alt="Penguins" class="penguins">
    </section>

    <!-- Football Field -->
    <section class="project">
        <h2>Football Field Overlay</h2>

        <div class="field-container">
            <img src="football_field.jpg" alt="Football Field" class="field">
            <img src="tic-tac-toe.png" alt="Tic Tac Toe" class="overlay">
        </div>
    </section>

    <!-- Dinosaur -->
    <section class="project">
        <h2>Blue Dinosaur</h2>
        <img src="dinosaur.png" alt="Dinosaur" class="dinosaur">
    </section>

    <!-- Seagull -->
    <section class="project">
        <h2>Seagull</h2>

        <div class="seagull-box">
            <img src="seagull.png" alt="Seagull" class="seagull">
        </div>
    </section>

    <!-- Butterfly -->
    <section class="project">
        <h2>Butterfly</h2>
        <img src="butterfly.jpg" alt="Butterfly" class="butterfly">
    </section>

    <!-- Theater Stage -->
    <section class="project">
        <h2>Stage Presentation</h2>

        <div class="stage">
            <img src="theater_stage.jpg" alt="Stage">
            <h3>Presenting</h3>
        </div>
    </section>

</body>
</html>
